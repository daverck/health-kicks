# HealthKicks runtime configuration.
# Environment variables HEALTHKICKS_* override these values.
environment: development
database_url: postgresql+psycopg2://healthkicks:healthkicks@localhost:5432/healthkicks
auto_create_tables: true
device_inactivity_days: 30
migrate_on_start: true

aws_iot:
  endpoint: a2k10w7ebf2tx9-ats.iot.eu-north-1.amazonaws.com
  haptic_command_topic: healthkicks/v1/{device_id}/commands/haptic


# Google SSO / JWT authentication.
# In production, set these via environment variables (HEALTHKICKS_*) instead.
auth:
  google_client_id: ""
  google_client_secret: ""
  oauth_redirect_uri: http://localhost:8000/api/v1/auth/google/callback
  frontend_redirect_url: ""   # empty => OAuth callback returns JSON (Swagger-friendly)
  jwt_secret: dev-only-insecure-secret
  jwt_algorithm: HS256
  access_token_expire_minutes: 60

public_origins:
  - http://localhost:3000

services:
  # One-shot service: applies Alembic migrations to the local Postgres before
  # the API starts (mirrors what entrypoint.sh does against RDS in production).
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      DATABASE_URL: postgresql+psycopg2://healthkicks:healthkicks@postgres:5432/healthkicks
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-}
      AWS_IOT_HAPTIC_COMMAND_TOPIC: ${AWS_IOT_HAPTIC_COMMAND_TOPIC:-healthkicks/v1/{device_id}/commands/haptic}
      HEALTHKICKS_INGEST_TOKEN: ${HEALTHKICKS_INGEST_TOKEN:?Set HEALTHKICKS_INGEST_TOKEN}
      HEALTHKICKS_ENVIRONMENT: production
      HEALTHKICKS_GOOGLE_CLIENT_ID: ${HEALTHKICKS_GOOGLE_CLIENT_ID:-}
      HEALTHKICKS_GOOGLE_CLIENT_SECRET: ${HEALTHKICKS_GOOGLE_CLIENT_SECRET:-}
      HEALTHKICKS_OAUTH_REDIRECT_URI: ${HEALTHKICKS_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      HEALTHKICKS_FRONTEND_REDIRECT_URL: ${HEALTHKICKS_FRONTEND_REDIRECT_URL:-}
      HEALTHKICKS_JWT_SECRET: ${HEALTHKICKS_JWT_SECRET:?Set HEALTHKICKS_JWT_SECRET}
      HEALTHKICKS_PUBLIC_ORIGINS: ${HEALTHKICKS_PUBLIC_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *api_env
      # Local containers auto-create schema as a fallback; migrations are the
      # source of truth via the `migrate` service above.
      HEALTHKICKS_AUTO_CREATE_TABLES: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: healthkicks
      POSTGRES_USER: healthkicks
      POSTGRES_PASSWORD: healthkicks
      # Faster local startup + tuned for integration-test churn.
      POSTGRES_INITDB_ARGS: --data-checksums
    command: ["postgres", "-c", "log_statement=ddl", "-c", "max_connections=100"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthkicks -d healthkicks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
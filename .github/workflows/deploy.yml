name: CI & CD - Test, Build & Deploy Backend to ECS Fargate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual deployment trigger from GitHub

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: healthkicks-backend
  ECS_CLUSTER: healthkicks-cluster-production
  ECS_SERVICE: healthkicks-backend-production

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Configurer Python 3.11
        run: uv python install 3.11

      - name: Installer les dépendances
        run: uv sync --frozen --all-groups

      - name: Exécuter la suite de tests avec pytest
        run: uv run pytest -v

  deploy:
    name: Build & Deploy Backend to ECS Fargate
    needs: test
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: backend-ecs-deployment
      cancel-in-progress: false
    # Automatic deployment after tests succeed on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: AWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::693906847467:role/healthkicks-github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build image and tag with both commit SHA and latest
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Roll out new ECS Fargate deployment and wait for stability
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"

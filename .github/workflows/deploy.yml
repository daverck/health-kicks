name: CI & CD - Test, Build & Deploy Backend to EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer le déploiement manuellement depuis GitHub

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: healthkicks-backend
  ACCOUNT_ID: 693906847467

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Configurer Python 3.11
        run: uv python install 3.11

      - name: Installer les dépendances
        run: uv sync --frozen --all-groups

      - name: Exécuter la suite de tests avec pytest
        run: uv run pytest -v

  deploy:
    name: Build & Deploy Backend to EC2
    needs: test
    concurrency:
      group: backend-ec2-deployment
      cancel-in-progress: false
    # Automatic deployment after tests succeed on the main branch
    if: github.ref == 'refs/heads/main'
    # if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: AWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build image and tag as latest + commit SHA
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: SSH Deployment to EC2 instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE_URI=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            # Log in to ECR from EC2 (fallback if amazon-ecr-credential-helper is not active)
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com 2>/dev/null || true

            # Preventive cleanup of stopped containers and unused images (including tagged)
            docker container prune -f
            docker image prune -a -f

            # Pull newly built image for this commit
            attempt=1
            max_attempts=3
            until docker pull "$IMAGE_URI"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Image pull failed after ${max_attempts} attempts."
                docker system df || true
                docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
                df -h "$docker_root" || true
                exit 1
              fi
              echo "Image pull failed (attempt ${attempt}/${max_attempts}); retrying..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done

            # Ensure persistent host log directory exists and is writable by non-root container UID 10001
            mkdir -p /home/ubuntu/logs
            chmod 777 /home/ubuntu/logs || true

            # Determine active and target slots for Zero-Downtime Blue/Green deployment
            if docker ps --format '{{.Names}}' | grep -Eq '^(healthkicks-blue|healthkicks-backend)$'; then
              TARGET_NAME="healthkicks-green"
              TARGET_PORT="8001"
              OLD_NAME="healthkicks-blue"
            else
              TARGET_NAME="healthkicks-blue"
              TARGET_PORT="8000"
              OLD_NAME="healthkicks-green"
            fi

            echo "Deploying new release to slot: ${TARGET_NAME} (port 127.0.0.1:${TARGET_PORT})"

            # Clean up any leftover stopped container in the target slot
            docker stop --timeout 5 "$TARGET_NAME" 2>/dev/null || true
            docker rm -f "$TARGET_NAME" 2>/dev/null || true

            # Start new container with IAM variables, bounded Docker log rotation (5x20m = 100MB max),
            # and rotated host log file persistence (/home/ubuntu/logs/healthkicks.log)
            # while the currently active container continues serving live traffic uninterrupted
            docker run -d \
              --name "$TARGET_NAME" \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=20m \
              --log-opt max-file=5 \
              -p 127.0.0.1:${TARGET_PORT}:8000 \
              -v /home/ubuntu/logs:/app/logs \
              -e HEALTHKICKS_LOG_FILE=/app/logs/healthkicks.log \
              --env-file /home/ubuntu/.env \
              "$IMAGE_URI"

            # Poll liveness probe for up to 90 seconds (accommodates Aurora resume and Alembic migrations)
            healthy=0
            max_attempts=30
            for i in $(seq 1 "$max_attempts"); do
              if curl -fsS "http://127.0.0.1:${TARGET_PORT}/health" >/dev/null 2>&1; then
                healthy=1
                echo "New container (${TARGET_NAME}) passed /health check on attempt ${i}/${max_attempts}."
                break
              fi
              # Fail fast if container crashed or exited prematurely
              if [ "$(docker inspect -f '{{.State.Running}}' "$TARGET_NAME" 2>/dev/null)" != "true" ]; then
                echo "Container ${TARGET_NAME} exited prematurely during startup."
                break
              fi
              if [ $((i % 5)) -eq 0 ]; then
                echo "Waiting for container startup and database migrations... (${i}/${max_attempts})"
              fi
              sleep 3
            done

            if [ "$healthy" -ne 1 ]; then
              echo "ERROR: New container (${TARGET_NAME}) failed health check within ${max_attempts} attempts ($((max_attempts * 3))s). Dumping container logs:"
              docker logs --tail 50 "$TARGET_NAME" || true
              docker stop --timeout 15 "$TARGET_NAME" || true
              docker rm "$TARGET_NAME" || true
              echo "Aborting deployment. Previous active container remains untouched and continues serving live traffic."
              exit 1
            fi

            # Switch Nginx upstream to the newly verified container port (0ms downtime)
            sudo tee /etc/nginx/conf.d/healthkicks-upstream.conf > /dev/null <<EOF
            upstream healthkicks_backend {
                server 127.0.0.1:${TARGET_PORT};
                keepalive 16;
            }
            EOF

            # Ensure Nginx site configuration references the dynamic upstream block
            if grep -q "proxy_pass http://127.0.0.1:8000;" /etc/nginx/sites-available/healthkicks 2>/dev/null; then
              sudo sed -i 's|proxy_pass http://127.0.0.1:8000;|proxy_pass http://healthkicks_backend;|g' /etc/nginx/sites-available/healthkicks
            fi

            sudo nginx -t && sudo systemctl reload nginx
            echo "Nginx traffic seamlessly switched to ${TARGET_NAME} on port ${TARGET_PORT}."

            # Gracefully drain and remove the retired container slot (and legacy container if present)
            docker stop --timeout 15 "$OLD_NAME" 2>/dev/null || true
            docker rm "$OLD_NAME" 2>/dev/null || true
            docker stop --timeout 15 healthkicks-backend 2>/dev/null || true
            docker rm healthkicks-backend 2>/dev/null || true

            # Cleanup replaced old image to keep disk space clean
            docker image prune -a -f

[project]
name = "healthkicks-backend"
version = "0.1.0"
description = "HealthKicks IoT backend for AWS IoT Core and haptic footwear"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.52.4",
    "authlib>=1.3.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "itsdangerous>=2.1.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real AWS IoT Core connection",
]

[project]
name = "healthkicks-backend"
version = "0.1.0"
description = "HealthKicks IoT backend for AWS IoT Core and haptic footwear"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.79",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "joblib>=1.4.0",
    "m2cgen>=0.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn==1.4.2",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a real AWS IoT Core connection",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*testclient.*:DeprecationWarning",
]
